<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c3a48"/><stop offset="1" stop-color="#3f505f"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.18" r="0.6">
    <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.75"/>
    <stop offset="0.45" stop-color="#f0b878" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#f0b878" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbe6c4"/><stop offset="1" stop-color="#cfd9df"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b5a4c"/><stop offset="0.5" stop-color="#4e4339"/><stop offset="1" stop-color="#2e2924"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.45"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="suitL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a4756"/><stop offset="1" stop-color="#1b232c"/>
  </linearGradient>
  <linearGradient id="suitR" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#55606b"/><stop offset="1" stop-color="#262d34"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e3b48f"/><stop offset="1" stop-color="#a87656"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4efe6"/><stop offset="1" stop-color="#d6d2cb"/>
  </linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e59a5e"/><stop offset="1" stop-color="#7a3f1f"/>
  </linearGradient>
  <linearGradient id="lith" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e8eef2"/><stop offset="1" stop-color="#8b9aa6"/>
  </linearGradient>
  <linearGradient id="nickel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9fb3a4"/><stop offset="1" stop-color="#3c4a42"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
    <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.08 0"/></filter>
</defs>

<!-- room -->
<rect width="1080" height="1920" fill="url(#wall)"/>
<!-- windows -->
<g opacity="0.9">
  <rect x="250" y="160" width="160" height="520" fill="url(#win)"/>
  <rect x="460" y="160" width="160" height="520" fill="url(#win)"/>
  <rect x="670" y="160" width="160" height="520" fill="url(#win)"/>
  <g stroke="#2c3a48" stroke-width="8">
    <line x1="250" y1="420" x2="830" y2="420"/>
    <line x1="330" y1="160" x2="330" y2="680"/><line x1="540" y1="160" x2="540" y2="680"/><line x1="750" y1="160" x2="750" y2="680"/>
  </g>
  <!-- distant skyline / industrial hint -->
  <g fill="#9aa9b4" opacity="0.55">
    <rect x="260" y="560" width="40" height="120"/><rect x="305" y="600" width="30" height="80"/>
    <rect x="480" y="540" width="20" height="140"/><rect x="505" y="590" width="50" height="90"/>
    <rect x="690" y="570" width="60" height="110"/><rect x="760" y="610" width="40" height="70"/>
  </g>
</g>
<rect width="1080" height="1920" fill="url(#glow)"/>
<!-- light beams -->
<g opacity="0.12" fill="#ffd9a0">
  <polygon points="250,680 410,680 620,1500 120,1500"/>
  <polygon points="670,680 830,680 1000,1500 560,1500"/>
</g>
<!-- floor line -->
<rect x="0" y="760" width="1080" height="1160" fill="#26313b" opacity="0.55"/>

<!-- far figures (small) -->
<g>
  <ellipse cx="400" cy="800" rx="22" ry="27" fill="url(#skin)"/>
  <path d="M400,775 q-24,2 -22,22 q10,-14 44,-4 q-2,-18 -22,-18z" fill="#2a2420"/>
  <path d="M355,900 q0,-62 45,-70 q45,8 45,70z" fill="url(#suitL)"/>
  <ellipse cx="680" cy="800" rx="22" ry="27" fill="url(#skin)"/>
  <path d="M680,773 q24,0 24,24 q-14,-10 -48,0 q2,-22 24,-24z" fill="#4a4a4a"/>
  <path d="M635,900 q0,-62 45,-70 q45,8 45,70z" fill="url(#suitR)"/>
</g>

<!-- table (perspective) -->
<polygon points="420,860 660,860 1140,1700 -60,1700" fill="url(#table)"/>
<polygon points="420,860 660,860 820,1140 260,1140" fill="url(#sheen)"/>
<polygon points="-60,1700 1140,1700 1140,1740 -60,1740" fill="#1e1a17"/>

<!-- mid figures -->
<g>
  <!-- left mid -->
  <path d="M175,1240 q-10,-150 120,-180 q60,30 70,150 l-30,40z" fill="url(#suitL)"/>
  <path d="M265,1065 l30,-10 l25,10 l-25,60z" fill="#e9eef2"/>
  <ellipse cx="292" cy="990" rx="40" ry="50" fill="url(#skin)"/>
  <path d="M292,940 q-46,2 -44,44 q14,-24 88,-10 q-2,-34 -44,-34z" fill="#1f1b18"/>
  <path d="M330,1150 q60,10 110,30 l-10,20 q-60,-10 -110,-20z" fill="url(#suitL)"/>
  <ellipse cx="440" cy="1192" rx="16" ry="10" fill="url(#skin)"/>
  <!-- right mid -->
  <path d="M905,1240 q10,-150 -120,-180 q-60,30 -70,150 l30,40z" fill="url(#suitR)"/>
  <path d="M815,1065 l-30,-10 l-25,10 l25,60z" fill="#dfe6ea"/>
  <ellipse cx="788" cy="990" rx="40" ry="50" fill="url(#skin)"/>
  <path d="M788,938 q46,2 46,48 q-20,-26 -92,-12 q2,-36 46,-36z" fill="#5b5b5b"/>
  <path d="M750,1150 q-60,10 -110,30 l10,20 q60,-10 110,-20z" fill="url(#suitR)"/>
  <ellipse cx="640" cy="1192" rx="16" ry="10" fill="url(#skin)"/>
</g>

<!-- documents (no readable text) -->
<g filter="url(#blur)">
  <polygon points="470,1150 610,1150 640,1250 445,1250" fill="url(#paper)"/>
  <g stroke="#9aa3aa" stroke-width="5" opacity="0.6">
    <line x1="480" y1="1175" x2="590" y2="1175"/><line x1="476" y1="1195" x2="600" y2="1195"/>
    <line x1="472" y1="1215" x2="560" y2="1215"/><line x1="468" y1="1235" x2="610" y2="1235"/>
  </g>
</g>
<!-- seal hint -->
<circle cx="600" cy="1232" r="11" fill="#a8402f" opacity="0.75"/>
<!-- folders left/right -->
<polygon points="300,1300 470,1290 470,1400 260,1415" fill="#2f4a63"/>
<polygon points="310,1292 470,1282 470,1300 300,1310" fill="#e9e3d8"/>
<polygon points="610,1290 780,1300 820,1415 610,1400" fill="#5a4636"/>
<polygon points="610,1282 770,1292 780,1310 610,1300" fill="#e9e3d8"/>
<!-- funding hint: stacked bars / chart card -->
<g transform="translate(700,1440)">
  <polygon points="0,0 190,0 230,140 -20,140" fill="url(#paper)" filter="url(#blur)"/>
  <rect x="30" y="80" width="26" height="45" fill="#4f6b82"/>
  <rect x="75" y="58" width="26" height="67" fill="#4f6b82"/>
  <rect x="120" y="34" width="26" height="91" fill="#d6924f"/>
  <rect x="165" y="14" width="26" height="111" fill="#d6924f"/>
</g>
<!-- pen -->
<line x1="560" y1="1300" x2="660" y2="1340" stroke="#1c1c1c" stroke-width="8" stroke-linecap="round"/>
<line x1="645" y1="1334" x2="660" y2="1340" stroke="#d8b46a" stroke-width="8" stroke-linecap="round"/>

<!-- mineral samples -->
<g>
  <ellipse cx="540" cy="1465" rx="120" ry="22" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <!-- copper ore -->
  <polygon points="430,1460 455,1410 500,1400 520,1440 505,1470" fill="url(#copper)"/>
  <polygon points="455,1410 500,1400 480,1430" fill="#f2b27c" opacity="0.7"/>
  <!-- lithium crystal cluster -->
  <polygon points="535,1470 548,1360 566,1470" fill="url(#lith)"/>
  <polygon points="560,1472 585,1385 600,1472" fill="url(#lith)"/>
  <polygon points="520,1472 522,1405 540,1472" fill="url(#lith)" opacity="0.85"/>
  <polygon points="548,1360 556,1400 541,1420" fill="#fff" opacity="0.6"/>
  <!-- nickel ore -->
  <path d="M610,1470 q-8,-50 30,-62 q42,-4 48,40 q4,24 -20,24z" fill="url(#nickel)"/>
  <circle cx="640" cy="1430" r="5" fill="#cfe0d3" opacity="0.7"/>
  <circle cx="660" cy="1446" r="4" fill="#cfe0d3" opacity="0.6"/>
</g>

<!-- foreground figures (backs, large) -->
<g>
  <path d="M-40,1920 q0,-330 230,-380 q190,40 210,380z" fill="url(#suitL)"/>
  <ellipse cx="190" cy="1450" rx="92" ry="108" fill="#1c1714"/>
  <path d="M120,1410 q70,-70 150,0 q-20,-50 -75,-55 q-60,5 -75,55z" fill="#2b231e"/>
  <path d="M1120,1920 q0,-330 -230,-380 q-190,40 -210,380z" fill="url(#suitR)"/>
  <ellipse cx="890" cy="1450" rx="92" ry="108" fill="#8a8178"/>
  <path d="M820,1430 q70,-90 140,0 q-10,-60 -70,-64 q-60,4 -70,64z" fill="#a39a90"/>
  <!-- rim light -->
  <path d="M110,1395 q80,-80 170,-10" stroke="#ffcf94" stroke-width="5" fill="none" opacity="0.55"/>
  <path d="M810,1395 q80,-80 170,-10" stroke="#ffcf94" stroke-width="5" fill="none" opacity="0.55"/>
</g>

<!-- grade & grain -->
<rect width="1080" height="1920" fill="#3d5a73" opacity="0.10"/>
<rect width="1080" height="1920" filter="url(#grain)"/>
<radialGradient id="vig" cx="0.5" cy="0.45" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
<rect width="1080" height="1920" fill="url(#vig)"/>
</svg>
